<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile UI Storybook</title>
<style>
  :root {
    --bg: #0f0f11;
    --surface: #1a1a1f;
    --surface2: #222228;
    --surface3: #2a2a32;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0f0f4;
    --text2: #9898a8;
    --text3: #5a5a6e;
    --accent: #6c63ff;
    --accent2: #8a84ff;
    --accent-bg: rgba(108,99,255,0.12);
    --green: #22c55e;
    --green-bg: rgba(34,197,94,0.12);
    --red: #ef4444;
    --red-bg: rgba(239,68,68,0.12);
    --amber: #f59e0b;
    --amber-bg: rgba(245,158,11,0.12);
    --blue: #3b82f6;
    --blue-bg: rgba(59,130,246,0.12);
    --radius: 10px;
    --radius-sm: 6px;
    --radius-lg: 16px;
    --sidebar-w: 260px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 14px; display: flex; height: 100vh; overflow: hidden; }

  /* Sidebar */
  #sidebar {
    width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden;
  }
  .sb-header { padding: 16px; border-bottom: 1px solid var(--border); }
  .sb-logo { font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
  .sb-logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .sb-search { margin-top: 10px; position: relative; }
  .sb-search input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 10px 6px 30px; color: var(--text); font-size: 12px; outline: none; }
  .sb-search input::placeholder { color: var(--text3); }
  .sb-search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 12px; }
  .sb-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
  .sb-nav::-webkit-scrollbar { width: 4px; }
  .sb-nav::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  .sb-group { margin-bottom: 4px; }
  .sb-group-label {
    font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase;
    letter-spacing: .08em; padding: 10px 16px 4px; cursor: pointer; display: flex; align-items: center; gap: 6px; user-select: none;
  }
  .sb-group-label .chevron { transition: transform .15s; }
  .sb-group-label.open .chevron { transform: rotate(90deg); }
  .sb-items { padding: 0 8px; }
  .sb-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: var(--radius-sm);
    cursor: pointer; color: var(--text2); font-size: 12px; transition: all .1s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sb-item:hover { background: var(--surface2); color: var(--text); }
  .sb-item.active { background: var(--accent-bg); color: var(--accent2); }
  .sb-item-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; opacity: .5; }
  .sb-count { font-size: 10px; color: var(--text3); margin-left: auto; }

  /* Main */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .main-header {
    padding: 14px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex-shrink: 0; background: var(--surface);
  }
  .main-title { font-size: 15px; font-weight: 600; }
  .main-badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; background: var(--accent-bg); color: var(--accent2); font-weight: 500; }
  .main-desc { font-size: 12px; color: var(--text2); margin-left: 4px; }
  .toolbar { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .tb-btn {
    font-size: 11px; padding: 5px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border2);
    background: transparent; color: var(--text2); cursor: pointer; transition: all .1s;
  }
  .tb-btn:hover { background: var(--surface2); color: var(--text); }
  .tb-btn.active { background: var(--surface3); color: var(--text); }

  /* Canvas */
  #canvas { flex: 1; overflow-y: auto; padding: 24px; }
  #canvas::-webkit-scrollbar { width: 6px; }
  #canvas::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  .component-header { margin-bottom: 20px; }
  .component-header h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  .component-header p { color: var(--text2); font-size: 13px; margin-top: 6px; line-height: 1.6; }
  .tags { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .tag { font-size: 10px; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--border2); color: var(--text2); }

  .story-section { margin-bottom: 32px; }
  .story-label { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .story-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .story-grid { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }

  /* Preview box */
  .preview {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    overflow: hidden; display: flex; flex-direction: column;
  }
  .preview-toolbar {
    display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }
  .preview-name { font-size: 11px; color: var(--text2); flex: 1; }
  .preview-state { font-size: 10px; padding: 1px 6px; border-radius: 10px; }
  .preview-body { padding: 20px; display: flex; align-items: center; justify-content: center; min-height: 80px; }
  .preview-body.padded { padding: 24px; }
  .preview-body.compact { padding: 12px 16px; min-height: 48px; }

  /* ─── ATOM COMPONENTS ─── */
  /* Buttons */
  .c-btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all .1s; white-space: nowrap; }
  .c-btn-primary { background: var(--accent); color: #fff; }
  .c-btn-secondary { background: var(--surface3); color: var(--text); border: 1px solid var(--border2); }
  .c-btn-ghost { background: transparent; color: var(--accent2); border: 1px solid rgba(108,99,255,.3); }
  .c-btn-danger { background: var(--red-bg); color: var(--red); border: 1px solid rgba(239,68,68,.2); }
  .c-btn-sm { padding: 5px 12px; font-size: 11px; border-radius: 5px; }
  .c-btn-lg { padding: 12px 24px; font-size: 15px; border-radius: 12px; }
  .c-btn-icon { width: 36px; height: 36px; padding: 0; border-radius: var(--radius-sm); display: inline-flex; align-items: center; justify-content: center; }
  .c-btn-fab { width: 52px; height: 52px; border-radius: 16px; background: var(--accent); color: #fff; border: none; font-size: 22px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .c-btn-mini-fab { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: #fff; border: none; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .c-btn-loading { opacity: .7; pointer-events: none; }
  .c-btn-disabled { opacity: .35; pointer-events: none; }

  /* Toggle */
  .c-toggle { position: relative; display: inline-block; width: 44px; height: 24px; }
  .c-toggle input { opacity: 0; width: 0; height: 0; }
  .c-toggle-track { position: absolute; inset: 0; background: var(--surface3); border-radius: 99px; transition: .2s; border: 1px solid var(--border2); }
  .c-toggle input:checked + .c-toggle-track { background: var(--accent); border-color: var(--accent); }
  .c-toggle-thumb { position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; background: var(--text2); border-radius: 50%; transition: .2s; }
  .c-toggle input:checked ~ .c-toggle-thumb { left: 23px; background: #fff; }

  /* Checkbox */
  .c-checkbox { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--border2); background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .c-checkbox.checked { background: var(--accent); border-color: var(--accent); }
  .c-checkbox.indeterminate { background: var(--accent); border-color: var(--accent); }

  /* Radio */
  .c-radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border2); background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .c-radio.checked { border-color: var(--accent); }
  .c-radio.checked::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

  /* Input */
  .c-input { background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 8px 12px; color: var(--text); font-size: 13px; width: 220px; outline: none; }
  .c-input:focus { border-color: var(--accent); }
  .c-input-wrap { display: flex; flex-direction: column; gap: 5px; }
  .c-label { font-size: 11px; font-weight: 500; color: var(--text2); }
  .c-helper { font-size: 11px; color: var(--text3); }
  .c-error-text { font-size: 11px; color: var(--red); }
  .c-input-icon-wrap { position: relative; display: inline-block; }
  .c-input-icon-wrap .c-input { padding-left: 32px; }
  .c-input-leading-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 14px; }
  .c-input-error { border-color: var(--red) !important; }
  .c-input-success { border-color: var(--green) !important; }

  /* Badge */
  .c-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; font-size: 10px; font-weight: 600; }
  .c-badge-red { background: var(--red); color: #fff; }
  .c-badge-accent { background: var(--accent); color: #fff; }
  .c-badge-green { background: var(--green); color: #fff; }
  .c-badge-dot { width: 8px; height: 8px; min-width: 8px; height: 8px; padding: 0; border-radius: 50%; }
  .c-badge-outline { background: transparent; border: 1px solid var(--border2); color: var(--text2); }

  /* Avatar */
  .c-avatar { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; flex-shrink: 0; overflow: hidden; }
  .c-avatar-sm { width: 28px; height: 28px; font-size: 10px; }
  .c-avatar-md { width: 40px; height: 40px; font-size: 14px; }
  .c-avatar-lg { width: 56px; height: 56px; font-size: 18px; }
  .c-avatar-purple { background: rgba(108,99,255,.2); color: var(--accent2); }
  .c-avatar-green { background: var(--green-bg); color: var(--green); }
  .c-avatar-blue { background: var(--blue-bg); color: var(--blue); }

  /* Tag/Chip */
  .c-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 99px; font-size: 11px; border: 1px solid var(--border2); color: var(--text2); cursor: pointer; }
  .c-chip.active { background: var(--accent-bg); border-color: rgba(108,99,255,.3); color: var(--accent2); }
  .c-chip-close { font-size: 10px; opacity: .6; cursor: pointer; }

  /* Slider */
  .c-slider { -webkit-appearance: none; width: 180px; height: 4px; border-radius: 2px; background: var(--surface3); outline: none; }
  .c-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; }

  /* Rating */
  .c-rating { display: flex; gap: 3px; }
  .c-star { color: var(--amber); font-size: 16px; }
  .c-star.empty { color: var(--surface3); }

  /* Progress */
  .c-progress-bar { height: 6px; border-radius: 3px; background: var(--surface3); overflow: hidden; width: 200px; }
  .c-progress-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width .3s; }
  .c-progress-ring { display: flex; align-items: center; justify-content: center; position: relative; }
  .c-progress-ring svg { transform: rotate(-90deg); }

  /* Skeleton */
  .c-skeleton { background: var(--surface3); border-radius: var(--radius-sm); animation: shimmer 1.5s infinite; }
  @keyframes shimmer { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
  .c-skeleton-text { height: 12px; border-radius: 6px; }
  .c-skeleton-circle { border-radius: 50%; }

  /* Spinner */
  .c-spinner { width: 24px; height: 24px; border: 2.5px solid var(--surface3); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Divider */
  .c-divider { width: 100%; height: 1px; background: var(--border); }
  .c-divider-label { display: flex; align-items: center; gap: 10px; width: 100%; }
  .c-divider-label span { font-size: 11px; color: var(--text3); white-space: nowrap; }
  .c-divider-label::before, .c-divider-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* Typography */
  .c-display { font-size: 32px; font-weight: 700; letter-spacing: -.03em; }
  .c-h1 { font-size: 24px; font-weight: 700; }
  .c-h2 { font-size: 20px; font-weight: 600; }
  .c-h3 { font-size: 17px; font-weight: 600; }
  .c-body { font-size: 14px; line-height: 1.6; color: var(--text); }
  .c-caption { font-size: 11px; color: var(--text2); }
  .c-overline { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); }
  .c-link { color: var(--accent2); text-decoration: underline; cursor: pointer; }
  .c-code { font-family: monospace; font-size: 12px; background: var(--surface3); padding: 2px 6px; border-radius: 4px; color: var(--amber); }

  /* Status dot */
  .c-status { width: 8px; height: 8px; border-radius: 50%; }
  .c-status-online { background: var(--green); }
  .c-status-offline { background: var(--text3); }
  .c-status-busy { background: var(--red); }
  .c-status-away { background: var(--amber); }

  /* Stepper */
  .c-stepper { display: flex; align-items: center; gap: 0; }
  .c-step-item { display: flex; align-items: center; }
  .c-step-circle { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .c-step-circle.done { background: var(--accent); color: #fff; }
  .c-step-circle.active { background: var(--accent-bg); color: var(--accent2); border: 2px solid var(--accent); }
  .c-step-circle.todo { background: var(--surface3); color: var(--text3); }
  .c-step-line { width: 40px; height: 2px; background: var(--border2); }
  .c-step-line.done { background: var(--accent); }

  /* Tabs */
  .c-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); }
  .c-tab { padding: 8px 14px; font-size: 12px; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .c-tab.active { color: var(--accent2); border-color: var(--accent); }

  /* Segmented */
  .c-segment { display: flex; background: var(--surface2); border-radius: var(--radius-sm); padding: 3px; gap: 2px; }
  .c-seg-item { padding: 5px 14px; border-radius: 6px; font-size: 12px; color: var(--text2); cursor: pointer; }
  .c-seg-item.active { background: var(--surface3); color: var(--text); }

  /* Bottom Nav */
  .c-bottom-nav { display: flex; background: var(--surface); border-top: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; width: 320px; }
  .c-bnav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 4px 8px; gap: 4px; cursor: pointer; color: var(--text3); font-size: 10px; position: relative; }
  .c-bnav-item.active { color: var(--accent2); }
  .c-bnav-icon { font-size: 20px; }
  .c-bnav-indicator { width: 20px; height: 3px; border-radius: 99px; background: var(--accent); position: absolute; bottom: 0; opacity: 0; }
  .c-bnav-item.active .c-bnav-indicator { opacity: 1; }

  /* Top App Bar */
  .c-top-bar { display: flex; align-items: center; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); width: 320px; border-radius: var(--radius-lg) var(--radius-lg) 0 0; gap: 12px; }
  .c-top-bar-title { font-size: 16px; font-weight: 600; flex: 1; }

  /* Card */
  .c-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  .c-card-body { padding: 14px 16px; }
  .c-card-title { font-size: 14px; font-weight: 600; }
  .c-card-sub { font-size: 12px; color: var(--text2); margin-top: 3px; }
  .c-card-img { width: 100%; height: 100px; background: linear-gradient(135deg, #1a1a2e, #2d1b69); object-fit: cover; display: flex; align-items: center; justify-content: center; color: var(--text3); font-size: 12px; }

  /* List item */
  .c-list-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); width: 280px; }
  .c-list-item:last-child { border-bottom: none; }
  .c-list-content { flex: 1; min-width: 0; }
  .c-list-title { font-size: 13px; font-weight: 500; }
  .c-list-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .c-list-trailing { font-size: 11px; color: var(--text3); }

  /* Toast */
  .c-toast { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--radius); font-size: 12px; min-width: 220px; }
  .c-toast-success { background: var(--green-bg); border: 1px solid rgba(34,197,94,.2); color: var(--green); }
  .c-toast-error { background: var(--red-bg); border: 1px solid rgba(239,68,68,.2); color: var(--red); }
  .c-toast-info { background: var(--blue-bg); border: 1px solid rgba(59,130,246,.2); color: var(--blue); }
  .c-toast-warn { background: var(--amber-bg); border: 1px solid rgba(245,158,11,.2); color: var(--amber); }

  /* Dropdown / Menu */
  .c-menu { background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); overflow: hidden; min-width: 160px; }
  .c-menu-item { padding: 9px 14px; font-size: 12px; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
  .c-menu-item:last-child { border-bottom: none; }
  .c-menu-item:hover { background: var(--surface3); }
  .c-menu-item.danger { color: var(--red); }

  /* Modal */
  .c-modal-backdrop { background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; width: 320px; height: 200px; border-radius: var(--radius-lg); }
  .c-modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; width: 240px; }
  .c-modal-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  .c-modal-body { font-size: 12px; color: var(--text2); margin-bottom: 16px; line-height: 1.6; }
  .c-modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

  /* Bottom Sheet */
  .c-bottom-sheet-wrap { width: 300px; height: 200px; background: rgba(0,0,0,.5); border-radius: var(--radius-lg); display: flex; align-items: flex-end; overflow: hidden; }
  .c-bottom-sheet { background: var(--surface); border-top: 1px solid var(--border); border-radius: var(--radius-lg) var(--radius-lg) 0 0; width: 100%; padding: 8px 16px 16px; }
  .c-sheet-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 12px; }
  .c-sheet-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; }

  /* Tooltip */
  .c-tooltip-wrap { position: relative; display: inline-flex; }
  .c-tooltip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: var(--surface3); border: 1px solid var(--border2); color: var(--text); font-size: 11px; padding: 5px 9px; border-radius: var(--radius-sm); white-space: nowrap; pointer-events: none; }
  .c-tooltip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: var(--border2); }

  /* Popover */
  .c-popover { background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 10px 14px; font-size: 12px; max-width: 200px; color: var(--text); }

  /* Accordion */
  .c-accordion { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; width: 280px; }
  .c-acc-item { border-bottom: 1px solid var(--border); }
  .c-acc-item:last-child { border-bottom: none; }
  .c-acc-header { padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-size: 13px; font-weight: 500; }
  .c-acc-body { padding: 0 14px 12px; font-size: 12px; color: var(--text2); line-height: 1.6; }

  /* Timeline */
  .c-timeline { display: flex; flex-direction: column; gap: 0; width: 240px; }
  .c-tl-item { display: flex; gap: 12px; }
  .c-tl-line-wrap { display: flex; flex-direction: column; align-items: center; }
  .c-tl-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 3px; }
  .c-tl-vline { width: 2px; flex: 1; background: var(--border); margin: 3px 0; min-height: 24px; }
  .c-tl-content { flex: 1; padding-bottom: 16px; }
  .c-tl-title { font-size: 12px; font-weight: 500; }
  .c-tl-time { font-size: 10px; color: var(--text3); margin-top: 2px; }

  /* Breadcrumb */
  .c-breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .c-breadcrumb-item { color: var(--text2); }
  .c-breadcrumb-item.active { color: var(--text); font-weight: 500; }
  .c-breadcrumb-sep { color: var(--text3); }

  /* Pagination */
  .c-pagination { display: flex; gap: 4px; align-items: center; }
  .c-page-btn { width: 32px; height: 32px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: transparent; color: var(--text2); font-size: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .c-page-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* OTP */
  .c-otp { display: flex; gap: 8px; }
  .c-otp-box { width: 40px; height: 48px; border: 1.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: var(--text); }
  .c-otp-box.filled { border-color: var(--accent); }
  .c-otp-box.focused { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }

  /* Search bar */
  .c-search-bar { display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 99px; padding: 8px 14px; width: 240px; }
  .c-search-bar input { background: transparent; border: none; outline: none; color: var(--text); font-size: 13px; flex: 1; }
  .c-search-bar input::placeholder { color: var(--text3); }

  /* Switch row (settings) */
  .c-settings-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); width: 280px; }
  .c-settings-row:last-child { border-bottom: none; }
  .c-settings-label { font-size: 13px; }
  .c-settings-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }

  /* Stat card */
  .c-stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; min-width: 130px; }
  .c-stat-label { font-size: 11px; color: var(--text2); }
  .c-stat-val { font-size: 24px; font-weight: 700; margin-top: 4px; }
  .c-stat-change { font-size: 11px; margin-top: 4px; }
  .c-stat-up { color: var(--green); }
  .c-stat-down { color: var(--red); }

  /* Profile card */
  .c-profile-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; text-align: center; width: 180px; }
  .c-profile-name { font-size: 14px; font-weight: 600; margin-top: 10px; }
  .c-profile-role { font-size: 11px; color: var(--text2); margin-top: 3px; }

  /* Chat bubble */
  .c-bubble-sent { background: var(--accent); color: #fff; border-radius: 16px 16px 4px 16px; padding: 9px 13px; font-size: 13px; max-width: 200px; align-self: flex-end; }
  .c-bubble-recv { background: var(--surface2); color: var(--text); border-radius: 16px 16px 16px 4px; padding: 9px 13px; font-size: 13px; max-width: 200px; border: 1px solid var(--border); }
  .c-chat-wrap { display: flex; flex-direction: column; gap: 8px; width: 280px; }

  /* Typing indicator */
  .c-typing { display: flex; gap: 4px; align-items: center; padding: 10px 14px; background: var(--surface2); border-radius: 16px 16px 16px 4px; width: fit-content; border: 1px solid var(--border); }
  .c-typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); animation: bounce .8s infinite; }
  .c-typing-dot:nth-child(2) { animation-delay: .1s; }
  .c-typing-dot:nth-child(3) { animation-delay: .2s; }
  @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-5px); } }

  /* Gauge-like progress */
  .c-gauge-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }

  /* Empty state */
  .c-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 24px; text-align: center; }
  .c-empty-icon { width: 48px; height: 48px; border-radius: 14px; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--text3); }
  .c-empty-title { font-size: 14px; font-weight: 600; }
  .c-empty-sub { font-size: 12px; color: var(--text2); max-width: 160px; line-height: 1.5; }

  /* Alert / inline alert */
  .c-alert { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--radius); font-size: 12px; line-height: 1.5; width: 260px; }
  .c-alert-success { background: var(--green-bg); border: 1px solid rgba(34,197,94,.2); color: var(--green); }
  .c-alert-error { background: var(--red-bg); border: 1px solid rgba(239,68,68,.2); color: var(--red); }
  .c-alert-info { background: var(--blue-bg); border: 1px solid rgba(59,130,246,.2); color: var(--blue); }
  .c-alert-warn { background: var(--amber-bg); border: 1px solid rgba(245,158,11,.2); color: var(--amber); }

  /* Drawer */
  .c-drawer-wrap { width: 300px; height: 200px; background: rgba(0,0,0,.5); display: flex; border-radius: var(--radius-lg); overflow: hidden; }
  .c-drawer { background: var(--surface); border-right: 1px solid var(--border); width: 180px; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
  .c-drawer-item { padding: 8px 10px; border-radius: var(--radius-sm); font-size: 12px; color: var(--text2); cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .c-drawer-item.active { background: var(--accent-bg); color: var(--accent2); }

  /* Action sheet */
  .c-action-sheet-wrap { width: 300px; height: 220px; background: rgba(0,0,0,.5); border-radius: var(--radius-lg); display: flex; align-items: flex-end; overflow: hidden; }
  .c-action-sheet { background: var(--surface); border-top: 1px solid var(--border); width: 100%; border-radius: var(--radius-lg) var(--radius-lg) 0 0; overflow: hidden; }
  .c-as-item { padding: 14px 16px; font-size: 13px; color: var(--text); border-bottom: 1px solid var(--border); text-align: center; cursor: pointer; }
  .c-as-item:last-child { border-bottom: none; }
  .c-as-item.danger { color: var(--red); }
  .c-as-item.cancel { color: var(--text2); }

  /* Numeric stepper */
  .c-num-stepper { display: flex; align-items: center; gap: 0; border: 1px solid var(--border2); border-radius: var(--radius-sm); overflow: hidden; }
  .c-num-stepper-btn { width: 34px; height: 34px; background: var(--surface2); border: none; color: var(--text); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .c-num-stepper-val { width: 44px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }

  /* FAB speed dial */
  .c-speed-dial { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .c-speed-dial-item { width: 36px; height: 36px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; color: var(--text2); }

  /* Tag input */
  .c-tag-input { display: flex; flex-wrap: wrap; gap: 5px; padding: 6px 10px; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-sm); width: 240px; min-height: 36px; }

  /* Swipe action row */
  .c-swipe-wrap { position: relative; width: 280px; overflow: hidden; border-radius: var(--radius-sm); }
  .c-swipe-row { display: flex; align-items: center; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); gap: 12px; font-size: 13px; transform: translateX(-60px); }
  .c-swipe-action { position: absolute; right: 0; top: 0; bottom: 0; width: 60px; background: var(--red-bg); display: flex; align-items: center; justify-content: center; color: var(--red); font-size: 14px; }

  /* Image card */
  .c-img-card { width: 160px; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border); }
  .c-img-card-img { width: 100%; height: 100px; background: linear-gradient(135deg, #1e3a5f, #2d1b69); display: flex; align-items: center; justify-content: center; color: var(--text3); font-size: 24px; }
  .c-img-card-body { padding: 10px 12px; background: var(--surface); }

  /* Data table */
  .c-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .c-table th { padding: 8px 12px; text-align: left; color: var(--text3); font-weight: 500; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border); }
  .c-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text); }
  .c-table tr:last-child td { border-bottom: none; }
  .c-table tr:hover td { background: var(--surface3); }

  /* Nav rail */
  .c-nav-rail { display: flex; flex-direction: column; align-items: center; background: var(--surface); border-right: 1px solid var(--border); padding: 12px 0; gap: 4px; height: 200px; width: 60px; border-radius: var(--radius-lg) 0 0 var(--radius-lg); }
  .c-rail-item { width: 44px; height: 40px; border-radius: var(--radius-sm); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; color: var(--text3); }
  .c-rail-item.active { background: var(--accent-bg); color: var(--accent2); }
  .c-rail-icon { font-size: 18px; }
  .c-rail-label { font-size: 8px; font-weight: 500; }

  /* Price tag */
  .c-price { display: flex; align-items: baseline; gap: 4px; }
  .c-price-currency { font-size: 13px; color: var(--text2); }
  .c-price-amount { font-size: 26px; font-weight: 700; }
  .c-price-period { font-size: 12px; color: var(--text2); }
  .c-price-orig { font-size: 12px; color: var(--text3); text-decoration: line-through; }

  /* Reaction */
  .c-reactions { display: flex; gap: 5px; flex-wrap: wrap; }
  .c-reaction { display: flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 99px; background: var(--surface2); border: 1px solid var(--border); font-size: 12px; cursor: pointer; }
  .c-reaction.active { background: var(--accent-bg); border-color: rgba(108,99,255,.3); }

  /* Media player */
  .c-player { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; width: 260px; }
  .c-player-title { font-size: 13px; font-weight: 600; }
  .c-player-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .c-player-controls { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 14px; }
  .c-player-btn { width: 32px; height: 32px; border-radius: 50%; background: transparent; border: 1px solid var(--border2); color: var(--text2); display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; }
  .c-player-play { width: 44px; height: 44px; background: var(--accent); border: none; color: #fff; font-size: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }

  /* Onboarding dot indicator */
  .c-dots { display: flex; gap: 6px; }
  .c-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--surface3); }
  .c-dot.active { width: 20px; border-radius: 3px; background: var(--accent); }

  /* Pull to refresh */
  .c-ptr { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--text3); font-size: 12px; padding: 12px; }

  /* Character counter */
  .c-char-count { display: flex; flex-direction: column; gap: 4px; width: 220px; }
  .c-char-row { display: flex; justify-content: space-between; align-items: center; }
  .c-char-num { font-size: 11px; color: var(--text3); }

  /* Floating action area */
  .c-fab-wrap { position: relative; width: 100px; height: 100px; }

  /* Utility */
  .flex { display: flex; }
  .flex-col { flex-direction: column; }
  .items-center { align-items: center; }
  .justify-center { justify-content: center; }
  .gap-2 { gap: 8px; }
  .gap-3 { gap: 12px; }
  .gap-4 { gap: 16px; }
  .w-full { width: 100%; }
  .text-sm { font-size: 12px; }
  .text-muted { color: var(--text2); }
  .mt-2 { margin-top: 8px; }

  /* ─── BATCH 1: NAVIGATION ADDITIONS ─── */
  .c-hamburger { width: 40px; height: 40px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--surface2); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; }
  .c-hamburger span { width: 18px; height: 2px; background: var(--text); border-radius: 2px; transition: all .2s; }
  .c-hamburger.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .c-hamburger.open span:nth-child(2) { opacity: 0; }
  .c-hamburger.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  .c-back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px 8px 10px; border-radius: 99px; border: 1px solid var(--border2); background: var(--surface2); color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; }
  .c-back-btn .arr { font-size: 16px; line-height: 1; }
  .c-back-icon { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border2); background: var(--surface2); color: var(--text); display: inline-flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; }
  .c-extfab { display: inline-flex; align-items: center; gap: 8px; padding: 14px 20px; border-radius: 16px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; border: none; cursor: pointer; box-shadow: 0 4px 16px rgba(108,99,255,.35); }
  .c-jumpnav { display: flex; flex-direction: column; gap: 2px; width: 180px; }

  .c-jumpnav-item.active { color: var(--text); border-left-color: var(--accent); background: var(--accent-bg); }
  .c-jumpnav-item .num { font-size: 10px; color: var(--text3); width: 14px; }
  .c-skiplink { padding: 8px 16px; border-radius: var(--radius-sm); background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 0 0 3px var(--accent-bg); }
  .c-cab { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--accent); border-radius: var(--radius-lg); width: 300px; color: #fff; }
  .c-cab-count { font-size: 14px; font-weight: 600; flex: 1; display: flex; align-items: center; gap: 10px; }
  .c-cab-close { font-size: 18px; cursor: pointer; opacity: .9; }
  .c-cab-actions { display: flex; gap: 14px; font-size: 16px; }
  .c-cab-actions span { cursor: pointer; opacity: .95; }
  .c-bsnav-wrap { width: 300px; background: var(--surface); border-radius: var(--radius-lg) var(--radius-lg) 0 0; border: 1px solid var(--border); border-bottom: none; overflow: hidden; }
  .c-bsnav-handle { width: 36px; height: 4px; border-radius: 99px; background: var(--border2); margin: 10px auto 4px; }
  .c-bsnav-item { display: flex; align-items: center; gap: 12px; padding: 13px 18px; font-size: 13px; color: var(--text); cursor: pointer; border-top: 1px solid var(--border); }
  .c-bsnav-item .ic { font-size: 18px; width: 22px; text-align: center; }
  .c-bsnav-item.active { color: var(--accent2); }
  .c-bsnav-item .chk { margin-left: auto; color: var(--accent2); }

  /* ─── BATCH 2: INPUT ADDITIONS ─── */
  .c-field { display: flex; flex-direction: column; gap: 5px; width: 240px; }
  .c-field-label { font-size: 12px; color: var(--text2); font-weight: 500; }
  .c-input-trailing { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 13px; }
  .c-input-icon-wrap .c-input.has-trailing { padding-right: 30px; }
  .c-pin { display: flex; gap: 10px; }
  .c-pin-box { width: 44px; height: 52px; border: 1.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--text); }
  .c-pin-box.filled { border-color: var(--accent); }
  .c-combo { position: relative; width: 240px; }
  .c-combo-list { margin-top: 4px; background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-sm); overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .c-combo-opt { padding: 9px 12px; font-size: 13px; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .c-combo-opt:hover, .c-combo-opt.active { background: var(--accent-bg); color: var(--accent2); }
  .c-combo-opt mark { background: transparent; color: var(--accent2); font-weight: 600; }
  .c-multiselect { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; padding: 6px 10px; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-sm); width: 240px; min-height: 38px; }
  .c-ms-chip { display: inline-flex; align-items: center; gap: 5px; background: var(--accent-bg); color: var(--accent2); padding: 3px 8px; border-radius: 6px; font-size: 12px; }
  .c-ms-chip span { cursor: pointer; opacity: .7; }
  .c-ms-input { flex: 1; min-width: 50px; background: transparent; border: none; outline: none; color: var(--text); font-size: 13px; }
  .c-datefield { display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 8px 12px; width: 240px; color: var(--text); font-size: 13px; cursor: pointer; }

  .c-datefield .val { flex: 1; }

  .c-cal-day.sel { background: var(--accent); color: #fff; }
  .c-cal-day.range { background: var(--accent-bg); color: var(--accent2); border-radius: 0; }
  .c-cal-day.range-start { background: var(--accent); color: #fff; border-radius: 6px 0 0 6px; }
  .c-cal-day.range-end { background: var(--accent); color: #fff; border-radius: 0 6px 6px 0; }
  .c-timepick { display: flex; align-items: center; gap: 6px; }

  .c-time-val { padding: 8px 0; font-size: 16px; font-weight: 600; color: var(--text); width: 100%; text-align: center; }
  .c-time-val.dim { color: var(--text3); font-size: 13px; font-weight: 400; padding: 4px 0; }

  .c-time-ampm { display: flex; flex-direction: column; gap: 4px; }

  .c-color-swatch { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--border2); cursor: pointer; }
  .c-color-row { display: flex; gap: 6px; }
  .c-color-dot { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; }
  .c-color-dot.sel { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
  .c-upload { width: 260px; border: 1.5px dashed var(--border2); border-radius: var(--radius); padding: 24px 16px; text-align: center; background: var(--surface2); cursor: pointer; }
  .c-upload.drag { border-color: var(--accent); background: var(--accent-bg); }
  .c-upload-icon { font-size: 28px; color: var(--text3); margin-bottom: 8px; }
  .c-upload-title { font-size: 13px; color: var(--text); font-weight: 500; }
  .c-upload-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }
  .c-upload-row { display: flex; align-items: center; gap: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; width: 260px; }
  .c-upload-row .ficon { width: 32px; height: 32px; border-radius: 6px; background: var(--accent-bg); color: var(--accent2); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }

    return T.map(([id,name,desc,html]) => ({ id, group:'Templates', name, layer:'Template', desc, tags:['template','screen','mobile'], stories:[{label:'Screen', html}] }));

];

const groups = {};
components.forEach(c => {
  if (!groups[c.group]) groups[c.group] = [];
  groups[c.group].push(c);
});

let currentId = null;
let lightMode = true;

function buildSidebar() {
  const nav = document.getElementById("sb-nav");
  nav.innerHTML = "";
  Object.entries(groups).forEach(([g, items]) => {
    const gEl = document.createElement("div");
    gEl.className = "sb-group";
    gEl.dataset.group = g;
    gEl.innerHTML = `<div class="sb-group-label open" onclick="toggleGroup(this)"><span class="chevron">›</span> ${g} <span class="sb-count">${items.length}</span></div><div class="sb-items" id="grp-${g.replace(/\s/g,'_')}">${items.map(c => `<div class="sb-item" id="si-${c.id}" onclick="showComponent('${c.id}')"><div class="sb-item-dot"></div>${c.name}</div>`).join("")}</div>`;
    nav.appendChild(gEl);
  });
}

function toggleGroup(label) {
  label.classList.toggle("open");
  const key = label.parentElement.dataset.group.replace(/\s/g,'_');
  const items = document.getElementById("grp-"+key);
  items.style.display = items.style.display === "none" ? "" : "none";
}

function filterSidebar(q) {
  const lq = q.toLowerCase();
  components.forEach(c => {
    const el = document.getElementById("si-"+c.id);
    if (!el) return;
    const match = !q || c.name.toLowerCase().includes(lq) || c.group.toLowerCase().includes(lq) || c.tags.some(t => t.includes(lq));
    el.style.display = match ? "" : "none";
  });
}

function showComponent(id) {
  const c = components.find(x => x.id === id);
  if (!c) return;
  currentId = id;
  document.querySelectorAll(".sb-item").forEach(el => el.classList.remove("active"));
  const si = document.getElementById("si-"+id);
  if (si) si.classList.add("active");
  document.getElementById("main-title").textContent = c.name;
  document.getElementById("main-badge").textContent = c.layer;
  document.getElementById("main-desc").textContent = c.desc;
  const layerColors = {Atom:"var(--accent-bg)",Molecule:"var(--green-bg)",Organism:"rgba(245,158,11,.12)",Template:"rgba(239,68,68,.1)"};
  const layerText = {Atom:"var(--accent2)",Molecule:"var(--green)",Organism:"var(--amber)",Template:"var(--red)"};
  const badge = document.getElementById("main-badge");
  badge.style.background = layerColors[c.layer] || "var(--accent-bg)";
  badge.style.color = layerText[c.layer] || "var(--accent2)";

  const canvas = document.getElementById("canvas");
  canvas.innerHTML = `
    <div class="component-header">
      <h1>${c.name}</h1>
      <p>${c.desc}</p>
      <div class="tags">${c.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
    </div>
    <div class="story-section">
      <div class="story-label">Variants & states</div>
      <div class="story-grid">
        ${c.stories.map(s => `
          <div class="preview">
            <div class="preview-toolbar">
              <span class="preview-name">${s.label}</span>
            </div>
            <div class="preview-body">
              ${s.html}
            </div>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function setTheme(t) {
  lightMode = t === "light";
  document.documentElement.style.setProperty("--bg", lightMode ? "#f5f5f7" : "#0f0f11");
  document.documentElement.style.setProperty("--surface", lightMode ? "#ffffff" : "#1a1a1f");
  document.documentElement.style.setProperty("--surface2", lightMode ? "#f0f0f5" : "#222228");
  document.documentElement.style.setProperty("--surface3", lightMode ? "#e5e5ea" : "#2a2a32");
  document.documentElement.style.setProperty("--border", lightMode ? "rgba(0,0,0,0.1)" : "rgba(255,255,255,0.08)");
  document.documentElement.style.setProperty("--border2", lightMode ? "rgba(0,0,0,0.18)" : "rgba(255,255,255,0.14)");
  document.documentElement.style.setProperty("--text", lightMode ? "#111113" : "#f0f0f4");
  document.documentElement.style.setProperty("--text2", lightMode ? "#4a4a5a" : "#9898a8");
  document.documentElement.style.setProperty("--text3", lightMode ? "#9898a8" : "#5a5a6e");
  document.getElementById("btn-light").classList.toggle("active", lightMode);
  document.getElementById("btn-dark").classList.toggle("active", !lightMode);
}

buildSidebar();
showComponent(components[0].id);
</script>
